security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"
        App\IdentityAccess\Domain\Model\User: "auto"

    providers:
        app_user_provider:
            id: App\IdentityAccess\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - path: ^/api/v1/auth/(login|refresh)$
          roles: PUBLIC_ACCESS
        - path: ^/api/v1/users$
          methods: [POST]
          roles: PUBLIC_ACCESS
        - path: ^/api/v1/users/[^/]+/verify_email$
          roles: PUBLIC_ACCESS
        - path: ^/api/v1/docs
          roles: PUBLIC_ACCESS
        - path: ^/api/v1/contexts
          roles: PUBLIC_ACCESS
        - path: ^/api
          roles: IS_AUTHENTICATED_FULLY

    role_hierarchy:
        ROLE_COMPANY_ADMIN: ROLE_RECRUITER
        ROLE_PLATFORM_ADMIN: ROLE_COMPANY_ADMIN

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
