# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
# parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"

    App\IdentityAccess\Domain\Repository\UserRepositoryInterface: '@App\IdentityAccess\Infrastructure\Doctrine\DoctrineUserRepository'
    App\IdentityAccess\Domain\Security\PasswordHasherInterface: '@App\IdentityAccess\Infrastructure\Security\SymfonyPasswordHasher'
    App\IdentityAccess\Infrastructure\Security\HmacEmailVerificationTokenizer:
        arguments:
            $secret: "%env(EMAIL_VERIFICATION_SECRET)%"
    App\IdentityAccess\Domain\Security\EmailVerificationTokenizerInterface: '@App\IdentityAccess\Infrastructure\Security\HmacEmailVerificationTokenizer'
    App\IdentityAccess\Domain\Notification\EmailVerificationNotifierInterface: '@App\IdentityAccess\Infrastructure\Notification\MailerEmailVerificationNotifier'
    App\IdentityAccess\Infrastructure\Notification\MailerEmailVerificationNotifier:
        arguments:
            $frontendUrl: "%env(FRONTEND_URL)%"
            $senderAddress: "%env(MAILER_SENDER_ADDRESS)%"
    Redis:
        class: Redis
        factory:
            ['App\Shared\Infrastructure\Redis\RedisClientFactory', "create"]
        arguments:
            $dsn: "%env(REDIS_DSN)%"
    App\IdentityAccess\Domain\Security\RefreshTokenStoreInterface: '@App\IdentityAccess\Infrastructure\Security\ValkeyRefreshTokenStore'
    App\IdentityAccess\Infrastructure\Security\JwtPayloadEnricher:
        tags:
            - {
                  name: kernel.event_listener,
                  event: lexik_jwt_authentication.on_jwt_created,
              }

    App\IdentityAccess\Domain\Security\AccessTokenIssuerInterface: '@App\IdentityAccess\Infrastructure\Security\LexikAccessTokenIssuer'
    App\Company\Domain\Repository\CompanyRepositoryInterface: '@App\Company\Infrastructure\Doctrine\DoctrineCompanyRepository'
